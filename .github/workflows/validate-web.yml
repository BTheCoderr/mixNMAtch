name: Validate Mix N Match

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -s web/src/App.jsx
          test -s web/public/manifest.webmanifest
          test -s netlify.toml
